name: Native Atto routing source-policy tests

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:

permissions:
  contents: read

jobs:
  rust-source-policy:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository without persisting credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checked-out source
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/verify_ci_checkout_head.sh
      - name: Record Rust compiler
        run: rustc --version && cargo --version
      - name: Validate native Atto source and Rust-only test harness
        run: cargo test --all-targets -- --nocapture
