name: Executed Atto routing guests
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-router:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        compiler: [project-pin, candidate-atto-main]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Build and execute real compiler guests
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          COMPILER_PROFILE: ${{ matrix.compiler }}
          CANDIDATE_SHA: b02efee4c036557278284ca444655e19cd0adc64
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse HEAD^{tree}
          export JAVA_HOME="${JAVA_HOME_21_X64:?JDK 21 required}"
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          compiler_sha="$(tr -d '[:space:]' < SOURCE_REF)"
          if [[ "$COMPILER_PROFILE" == candidate-atto-main ]]; then compiler_sha="$CANDIDATE_SHA"; fi
          [[ "$compiler_sha" =~ ^[0-9a-f]{40}$ ]]
          compiler_dir="$RUNNER_TEMP/atto-source.java"
          git init "$compiler_dir"
          git -C "$compiler_dir" remote add origin https://github.com/atto-lang/atto-source.java.git
          git -C "$compiler_dir" fetch --depth=1 origin "$compiler_sha"
          git -C "$compiler_dir" checkout --detach FETCH_HEAD
          test "$(git -C "$compiler_dir" rev-parse HEAD)" = "$compiler_sha"
          (cd "$compiler_dir" && mvn -B -q -DskipTests package dependency:build-classpath -Dmdep.outputFile=target/classpath.txt)
          export ORESLANG_SOURCE_DIR="$compiler_dir"
          export ORESLANG_COMPILER="$GITHUB_WORKSPACE/scripts/compiler.sh"
          test -z "$(git -C "$compiler_dir" status --porcelain --untracked-files=all)"
          if [[ "$COMPILER_PROFILE" == project-pin ]]; then
            bash scripts/test.sh
          else
            # Diagnostic candidate uses a different compiler pin but unchanged guest bytes.
            actual="$(mktemp)"
            trap 'rm -f "$actual"' EXIT
            "$ORESLANG_COMPILER" --check --platform=server "$GITHUB_WORKSPACE/tests/router_semantics.atto"
            "$ORESLANG_COMPILER" --platform=server "$GITHUB_WORKSPACE/tests/router_semantics.atto" > "$actual"
            diff -u tests/expected.txt "$actual"
            count=0
            for guest in tests/guest_*.atto; do
              test -f "$guest" && test ! -L "$guest"
              golden="${guest%.atto}.expected"
              test -f "$golden" && test ! -L "$golden"
              "$ORESLANG_COMPILER" --check --platform=server "$GITHUB_WORKSPACE/$guest"
              "$ORESLANG_COMPILER" --platform=server "$GITHUB_WORKSPACE/$guest" > "$actual"
              diff -u "$golden" "$actual"
              echo "PASS: $guest"
              count=$((count+1))
            done
            test "$count" -gt 0
            echo "Executed $count native guest fixtures on candidate $compiler_sha"
          fi
